<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
    <title>Todo App</title>
  </head>
  <body>
    <header>
      <h1>Tasks Manager</h1>
    </header>

    <main class="main-container">
      <div class="task-input-container">
        <input
          type="text"
          id="taskName"
          placeholder="task name..."
          class="input"
        />
        <select id="labels" class="input">
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
          <option value="Backlog">Backlog</option>
        </select>
        <input type="date" class="input" id="dateInput" />
        <button class="add-task-btn">Add Task</button>
      </div>

      <div class="sort-container" id="sortButtons">
        <select id="selectSort" class="input">
          <option value="All">All</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
          <option value="Backlog">Backlog</option>
        </select>
        <button class="sort-btn overdue-btn" id="overdueTasks">Overdue</button>
        <button class="sort-btn today-btn" id="todaysTasks">Today</button>
        <button class="sort-btn upcoming-btn" id="upcomingTasks">
          Upcoming
        </button>
      </div>

      <div class="task-title-container">
        <h1 class="task-title"></h1>
      </div>

      <div class="tasks-container">
        <ul class="tasks-list"></ul>
      </div>
    </main>
    <script src="scripts/main.js" type="module"></script>
  </body>
</html>
